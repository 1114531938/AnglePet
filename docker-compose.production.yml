services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    expose:
      - "3100"
    depends_on:
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ${ANGLEPET_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql+psycopg://pet:${POSTGRES_PASSWORD}@postgres:5432/pet
    expose:
      - "8000"
    volumes:
      - ./${ANGLEPET_ENV_FILE:-.env.production}:/app/.env
      - uploads_data:/app/uploads
      - openclaw_data:/data/openclaw
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet -d pet"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  uploads_data:
  openclaw_data:
